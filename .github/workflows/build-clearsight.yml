name: Build ClearSight Utilities

on:
  push:
    branches:
      - client-utility-mod-build
    paths:
      - "utility-mod/**"
      - ".github/workflows/build-clearsight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Compile and package mod
        working-directory: utility-mod
        run: gradle build --no-daemon
      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: clearsight-utilities-mc1.21.11
          path: utility-mod/build/libs/clearsight-utilities-*.jar
          if-no-files-found: error
          retention-days: 14
